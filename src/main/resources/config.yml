# Configuration principale de SHMessageAnnouncer
# ------------------------------------------------
# announcer_enabled: Démarre-t-il les annonces au lancement du serveur ?
# announcer_random: Les annonces dans la 'interval_announcement_list' doivent-elles être aléatoires ? (false = dans l'ordre)
# announce_interval: Intervalle entre chaque annonce (en secondes).

announcer_enabled: true
announcer_random: false
announce_interval: 324

# Configuration du son joué avec chaque annonce
sound:
  enabled: true
  sound_name: BLOCK_NOTE_BLOCK_PLING
  volume: 10
  pitch: 0.5

# Liste des annonces à diffuser à intervalle régulier.
# Les noms doivent correspondre aux annonces définies ci-dessous.
interval_announcement_list:
- vote
#- doublevote
- enchanteur
- trade
- challenges
- report
- duel
- discord
- regles
- farming
- afkt
- slotsponsor
- topvote
- 300votes
- tokensenfolie
- voteparty
- codex
- skyhand
- suggestions

# Définition des annonces.
# Chaque annonce utilise le format MiniMessage pour les couleurs, clics, hovers, etc.
# <br>  est utilisé pour les sauts de ligne à l'intérieur d'une même annonce.
announcements:
  tournois:
  - '<hover:show_text:"<#F9D423>Cliquez pour plus d''infos sur le tournoi !"><click:run_command:''/tournois''>
    <br> <gradient:#FF416C:#FF4B2B><b>Tournois du Nouvel An Lunaire !</b></gradient> <#FF416C>🏮
    <br> 
    <br> <white>Participez au tournois du nouvel an lunaire et tentez de
    <br> <white>finir dans le top pour gagner des récompenses !
    <br> '

