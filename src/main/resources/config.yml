# Configuration principale de SHMessageAnnouncer
# ------------------------------------------------
# Plugin : annonces automatiques envoyées à tous les joueurs à intervalle régulier, en MiniMessage, avec un son et les
# placeholders de PlaceholderAPI évalués pour chaque joueur. Avec SHNetwork, une seule rotation tourne pour tous les
# serveurs Opale (voir la section 'reseau' plus bas).
#
# Commandes (racine /shmessageannouncer, alias /msa) :
#   /shmessageannouncer start                     Démarre les annonces automatiques (sur tous les serveurs avec SHNetwork).
#   /shmessageannouncer stop                      Arrête les annonces automatiques (sur tous les serveurs avec SHNetwork).
#   /shmessageannouncer reload                    Recharge config.yml et messages.yml sur ce serveur.
#   /shmessageannouncer list <active|all>         Liste les annonces de la rotation, ou toutes les annonces.
#   /shmessageannouncer announce <id> [joueur]    Envoie une annonce à tous les joueurs (de tous les serveurs avec
#                                                 SHNetwork), avec les placeholders du joueur donné s'il y en a un ;
#                                                 l'ordre de la rotation n'est pas touché.
#   /shmessageannouncer send <joueur> <id>        Envoie une annonce à un joueur.
# Toutes marchent depuis la console. Sans sous-commande, une ligne d'usage donne celles que vous pouvez utiliser.
#
# Permissions (op par défaut) :
#   shmessageannouncer.admin            Toutes les sous-commandes.
#   shmessageannouncer.admin.start      /shmessageannouncer start
#   shmessageannouncer.admin.stop       /shmessageannouncer stop
#   shmessageannouncer.admin.reload     /shmessageannouncer reload
#   shmessageannouncer.admin.list       /shmessageannouncer list
#   shmessageannouncer.admin.announce   /shmessageannouncer announce
#   shmessageannouncer.admin.send       /shmessageannouncer send
#
# Un reload valide config.yml et messages.yml avant de les appliquer : si l'un est invalide, rien ne change et le
# message donne le fichier et l'erreur. Il relance le minuteur (la rotation repart du début) ; sans SHNetwork, les
# annonces redémarrent si announcer_enabled est vrai. La section 'reseau' demande un redémarrage.
#
# Les messages des commandes sont dans 'messages.yml'.
#
# announcer_enabled: Démarre-t-il les annonces au lancement du serveur ?
# announcer_random: Les annonces dans la 'interval_announcement_list' doivent-elles être aléatoires ? (false = dans l'ordre)
# announce_interval: Intervalle entre chaque annonce (en secondes).

announcer_enabled: true
announcer_random: false
announce_interval: 300

# Configuration du son joué avec chaque annonce
sound:
  enabled: true
  sound_name: BLOCK_NOTE_BLOCK_PLING
  volume: 10
  pitch: 0.5

# Mode réseau (SHNetwork). Les annonces automatiques ne tournent que sur le serveur meneur (tâche 'shmessageannouncer') :
# il choisit l'annonce, fait avancer la liste et la publie ; chaque serveur l'envoie à ses propres joueurs au même
# moment, avec le même son, en évaluant les placeholders pour chacun d'eux. Si le meneur tombe, un autre serveur reprend
# la rotation là où elle s'était arrêtée. Le config.yml doit être le même sur tous les serveurs.
# Sans SHNetwork, ou avec actif: false, chaque serveur fait tourner ses annonces comme avant.
# Demande un redémarrage : actif, canal.
reseau:
  actif: true
  # Canal du bus SHNetwork sur lequel les serveurs se transmettent les annonces
  canal: messageannouncer

# Liste des annonces à diffuser à intervalle régulier.
# Les noms doivent correspondre aux annonces définies ci-dessous.
interval_announcement_list:
- vote
- trade
- regles

# Définition des annonces.
# Chaque annonce utilise le format MiniMessage pour les couleurs, clics, hovers, etc.
# <br>  est utilisé pour les sauts de ligne à l'intérieur d'une même annonce.
announcements:
  vote:
  - '<hover:show_text:"<#40E0D0>Cliquez pour voter et soutenir le serveur ! <gray>(Merci ❤)"><click:open_url:''https://example.com/vote''>
    <br> <#40E0D0><b>Votez pour le serveur !</b> <#40E0D0>✨
    <br> 
    <br> <white>Voter permet de gagner des tonnes de récompenses
    <br> <white>tout en soutenant le serveur.
    <br> '

  trade:
  - '<hover:show_text:"<#5DADE2>Utilisez /trade <joueur> pour échanger !"><click:suggest_command:''/trade ''>
    <br> <#5DADE2><b>Échanges Sécurisés !</b> <#5DADE2>🤝
    <br> 
    <br> <white>Faites des <#58D68D>échanges <white>en toute <#58D68D>sécurité
    <br> <white>avec d''autres joueurs. &8(&7/trade <joueur>&8)
    <br> '

  regles:
  - '<hover:show_text:"<#27AE60>Lisez les règles avec /regles !"><click:run_command:''/regles''>
    <br> <#27AE60><b>Lisez les Règles !</b> <#27AE60>📜
    <br> 
    <br> <white>%player_name%, n''oubliez pas de lire les <#27AE60>règles<white> si vous ne
    <br> <white>voulez pas être <#C0392B>sanctionné
    <br> '
